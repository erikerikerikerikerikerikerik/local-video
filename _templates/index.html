<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>local-video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="gallery gallery-10">
        {% for video in videos %}
            {% if video_thumbnails[video] %}
                {% set directory_name, file_name = video.rsplit('/', 1) %}
                <div class="gallery-item">
                    <a href="{{ url_for('play_video', filename=video) }}" target="_blank">
                        <div class="favorite-star" onclick="toggleFavorite(event, '{{ video }}')">★</div>
                        <img class="thumbnail" 
                             src="{{ url_for('serve_thumbnail', filename=video_thumbnails[video][0]) }}" 
                             alt="Video Thumbnail"
                             data-thumbnails="{{ video_thumbnails[video] | join(',') }}">
                        <div class="overlay">
                            <div class="directory-name">{{ directory_name }}</div>
                            <div class="file-name">{{ file_name }}</div>
                        </div>
                    </a>
                </div>
            {% endif %}
        {% endfor %}
    </div>

    <div class="floating-buttons">
        <button onclick="setGridColumns(3)">III</button>
        <button onclick="setGridColumns(5)">V</button>
        <button onclick="setGridColumns(10)">X</button>
        <button onclick="setGridColumns(20)">!</button>
        <a href="{{ url_for('directory', subdir='') }}">
            <button>?</button>
        </a>
    </div>
    <div class="floating-buttons left">
        <button onclick="toggleFavoriteView()">★</button>
        <div id="video-count" style="font-weight: bold; margin-top: 4px;">{{ video_count }}</div>
    </div>

    <script>
        let favoriteViewActive = false;
    
        async function loadFavorites() {
            const res = await fetch('/api/favorites');
            const favorites = await res.json();
    
            document.querySelectorAll('.gallery-item').forEach(item => {
                const star = item.querySelector('.favorite-star');
                const videoPath = star?.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
                if (favorites[videoPath]) {
                    star.classList.add('favorited');
                }
            });
        }
    
        async function toggleFavorite(event, video) {
            event.preventDefault();
            event.stopPropagation();
            const star = event.target;
            const isFavorited = star.classList.toggle('favorited');
    
            await fetch('/api/favorite', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ filename: video, favorite: !!isFavorited })
            });
        }
    
        async function toggleFavoriteView() {
            favoriteViewActive = !favoriteViewActive;
            const res = await fetch('/api/favorites');
            const favorites = await res.json();
    
            document.querySelectorAll('.gallery-item').forEach(item => {
                const star = item.querySelector('.favorite-star');
                const videoPath = star?.getAttribute('onclick')?.match(/'([^']+)'/)?.[1];
    
                if (favoriteViewActive) {
                    if (!favorites[videoPath]) {
                        item.classList.add('dimmed');
                    }
                } else {
                    item.classList.remove('dimmed');
                }
            });
        }
    
        function setGridColumns(columns) {
            const gallery = document.querySelector('.gallery');
            gallery.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
    
            gallery.classList.remove('gallery-3', 'gallery-5', 'gallery-10', 'gallery-20');
            gallery.classList.add(`gallery-${columns}`);
        }
    
        document.addEventListener('DOMContentLoaded', () => {
            loadFavorites();
    
            document.querySelectorAll('.thumbnail').forEach(thumbnail => {
                const thumbnailsList = thumbnail.dataset.thumbnails.split(',');
                let currentIndex = 0;
                let interval;
    
                thumbnail.addEventListener('mouseover', () => {
                    interval = setInterval(() => {
                        currentIndex = (currentIndex + 1) % thumbnailsList.length;
                        thumbnail.src = `/_thumbnails/${thumbnailsList[currentIndex].trim()}`;
                    }, 500);
                });
    
                thumbnail.addEventListener('mouseout', () => {
                    clearInterval(interval);
                    thumbnail.src = `/_thumbnails/${thumbnailsList[0].trim()}`;
                });
            });
        });
    </script>
</body>
</html>
