<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>local-video</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <div class="gallery gallery-10">
        {% for video in videos %}
            {% if video_thumbnails[video] %}
                {% set directory_name, file_name = video.rsplit('/', 1) %}
                <div class="gallery-item" data-video="{{ video }}" data-tags="{{ tags.get(video, [])|join(',') }}">
                    <a href="{{ url_for('play_video', filename=video) }}" target="_blank">
                        <div class="favorite-star">★</div>
                        <img class="thumbnail"
                             src="{{ url_for('serve_thumbnail', filename=video_thumbnails[video][0]) }}"
                             alt="Video Thumbnail"
                             data-video="{{ video }}"
                             data-poster="{{ video_thumbnails[video][0] }}">
                        <div class="overlay">
                            <div class="directory-name">{{ directory_name }}</div>
                            <div class="file-name">{{ file_name }}</div>
                        </div>
                        <div class="tag-menu" data-video="{{ video }}">
                            <button class="tag-menu-button" type="button">#</button>
                            <div class="tag-menu-panel">
                                <div class="video-tag-options">
                                    {% for tag in all_tags %}
                                        <button class="video-tag-option {% if tag in tags.get(video, []) %}selected{% endif %}"
                                                data-tag="{{ tag }}"
                                                type="button">#{{ tag }}</button>
                                    {% endfor %}
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            {% endif %}
        {% endfor %}
    </div>

    <div class="floating-buttons">
        <button onclick="setGridColumns(3)">III</button>
        <button onclick="setGridColumns(5)">V</button>
        <button onclick="setGridColumns(10)">X</button>
        <button onclick="setGridColumns(20)">!</button>
        <a href="{{ url_for('directory', subdir='') }}">
            <button>?</button>
        </a>
    </div>
    <div class="floating-buttons left">
        <div class="favorite-control">
            <div id="video-count">{{ video_count }}</div>
            <button onclick="toggleFavoriteView()">★</button>
        </div>
        <div class="tag-controls">
            <div class="new-tag-box">
                <input id="new-tag-input" type="text" placeholder="nieuwe tag">
                <button id="new-tag-button" type="button">+</button>
            </div>
            <div class="tag-filter-buttons">
                {% for tag in all_tags %}
                    <button class="tag-filter-button" data-tag="{{ tag }}" type="button">#{{ tag }}</button>
                {% endfor %}
            </div>
        </div>
    </div>
</body>
</html>
